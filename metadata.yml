Title: MACAW (Molecular AutoenCoding Auto-Workaround)
Description: 'MACAW embeds molecules into 100 continuous coordinates using a deliberately lightweight recipe, projecting structures against a set of reference compounds rather than training a deep network. Blay and colleagues built it so that embeddings can be produced on a laptop and, being smooth and low-dimensional, inverted for design: a point in the space can be mapped back towards real molecules. The number of dimensions is configurable, and the value chosen here is one setting rather than an intrinsic property.'
